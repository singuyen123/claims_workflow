# Optional: a disposable PostgreSQL 17 for reviewers who prefer Docker over a native install.
#   docker compose up -d
#   DATABASE_ADMIN_URL=postgres://postgres:postgres@localhost:5432/postgres (in .env)
#   npm run db:setup && npm run db:migrate && npm run db:seed
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
